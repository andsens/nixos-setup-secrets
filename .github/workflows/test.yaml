name: Test

on:
  # ** rather than *, so pushes to branches with a slash in the name - which
  # is every branch Dependabot opens - are tested too.
  push:
    branches: ['**']
  # So the checks can be re-run by hand.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
    # The VM test under the NixOS test driver needs KVM. The mode systemd gives /dev/kvm upstream: a group won't do, as
    # Nix drops the supplementary groups of sandboxed builds
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Nix
      uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          system-features = kvm nixos-test benchmark big-parallel
    - name: Check the flake
      run: nix flake check -L
    - name: Build the packages
      run: |
        # Quoted, since names like docopt.sh would otherwise be attribute paths
        refs=$(nix eval --json .#packages.x86_64-linux --apply builtins.attrNames | jq -r '.[] | ".#packages.x86_64-linux.\"\(.)\""')
        # shellcheck disable=SC2086 # one flake ref per word
        [[ -z $refs ]] || nix build --print-build-logs $refs
