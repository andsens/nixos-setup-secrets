version: 2
updates:
- package-ecosystem: nix
  directory: /
  schedule:
    interval: weekly
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
- package-ecosystem: gomod
  directory: /nix/modules/default/src
  schedule:
    interval: weekly
  groups:
    go:
      patterns:
      - '*'
